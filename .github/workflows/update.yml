name: Daily ipko guide update

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update ipko_en.json
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python updater.py
      - name: Commit and push
        run: |
          git config user.name "ipko-bot"
          git config user.email "ipko-bot@users.noreply.github.com"
          git add ipko_en.json
          git diff --cached --quiet || git commit -m "Daily update: $(date -u +%F)"
          git push
